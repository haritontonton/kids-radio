<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>おうちラジオ</title>
  <meta name="theme-color" content="#ffb703">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おうちラジオ">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="back" id="back" aria-label="もどる" hidden>‹ もどる</button>
    <h1 id="heading">おうちラジオ</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- 再生バー（下に固定） -->
  <section class="player" id="player" hidden>
    <img id="p-img" alt="">
    <div class="p-info">
      <div class="p-title" id="p-title"></div>
      <div class="p-show" id="p-show"></div>
      <input type="range" id="p-seek" min="0" max="100" value="0" step="1" aria-label="再生位置">
      <div class="p-time"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
    </div>
    <div class="p-ctrl">
      <button id="p-back" aria-label="15秒もどる">↺15</button>
      <button id="p-play" class="play" aria-label="再生">▶</button>
      <button id="p-fwd" aria-label="30秒すすむ">30↻</button>
      <button id="p-rate" class="rate" aria-label="はやさ">1x</button>
    </div>
  </section>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
